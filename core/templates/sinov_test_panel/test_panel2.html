{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8">
    <title>AvtoIbrat - Sinov test</title>

    <link rel="shortcut icon" href="{% static 'sinov_test_panel/favicon.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'sinov_test_panel/style.css' %}">
</head>
<body>

<!-- ================= TOP BAR ================= -->
<div class="top-bar">
    <img src="{% static 'sinov_test_panel/logo.png' %}" class="logo" alt="Logo">
    {{ request.user.get_full_name }}

    <div class="top-icons">
        <div class="timer" id="timer">
            <i class="fa-solid fa-clock"></i> --:--
        </div>

        <!-- ✅ TIMER UCHUN MUHIM -->
        <input type="hidden" id="remainingTime" value="{{ remaining_time }}">

        <button class="icon-btn" id="fsBtn">
            <span class="key-hint">L</span>
            <i class="fa-solid fa-expand"></i>
        </button>

        <button class="icon-btn" onclick="openExitModal()">
            <span class="key-hint">ESC</span>
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </div>
</div>

<!-- ================= QUESTION ================= -->
<div class="question-bar" id="questionText"></div>

<div class="wrapper">
    <div class="left" id="answers"></div>
    <div class="right" id="questionImage"></div>
</div>

<!-- ================= NUMBERS ================= -->
<div class="bottom-bar">
    <div class="numbers" id="numbers"></div>
</div>

<!-- ================= ANSWER CONFIRM MODAL ================= -->
<div id="answerModal" class="modal-answer">
    <div class="modal-content-answer">
        <h3 id="modalTitle">—</h3>
        <div class="ans-buttons">
            <button class="cancel-ans" onclick="closeAnswerModal()">{% trans "Bekor qilish" %}</button>
            <button class="confirm-ans" onclick="confirmAnswer()">{% trans "Tasdiqlash" %}</button>
        </div>
    </div>
</div>

<!-- ================= EXIT MODAL ================= -->
<div id="exitModal" class="modal-exit">
    <div class="modal-content-exit">
        <h3>{% trans "Imtihonni yakunlaysizmi?" %}</h3>
        <div class="exit-buttons">
            <button class="stay-btn" onclick="closeExitModal()">{% trans "Davom etish" %}</button>
            <button class="leave-btn" onclick="finishTest()">{% trans "Chiqish" %}</button>
        </div>
    </div>
</div>

<!-- ================= QUESTIONS DATA ================= -->
{{ questions|json_script:"questions-data" }}

<script>
/* ================= DATA ================= */
const sessionId = {{ session.id }};
const questions = JSON.parse(
    document.getElementById("questions-data").textContent
);

let index = 0;
let selectedAnswer = null;
let selectedBtn = null;
const answersState = {}; // pending | correct | wrong

/* ================= TIMER ================= */
const timerEl = document.getElementById("timer");
let timeLeft = parseInt(
    document.getElementById("remainingTime").value,
    10
);

function startTimer() {
    const interval = setInterval(() => {
        const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
        const s = String(timeLeft % 60).padStart(2, "0");

        timerEl.innerHTML =
            `<i class="fa-solid fa-clock"></i> ${m}:${s}`;

        if (timeLeft <= 0) {
            clearInterval(interval);
            finishTest();
        }

        timeLeft--;
    }, 1000);
}

/* ================= RENDER QUESTION ================= */
function renderQuestion() {
    const q = questions[index];
    document.getElementById("questionText").innerText = q.text;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((a, i) => {
        answersDiv.innerHTML += `
        <div class="answer-row">
            <span class="key">F${i + 1}</span>
            <button class="ans-btn"
                data-correct="${a.is_correct}"
                onclick="selectAnswer(${a.id}, \`${a.text}\`, this)">
                ${a.text}
            </button>
        </div>`;
    });

    document.getElementById("questionImage").innerHTML =
        q.image ? `<img src="${q.image}">` : "";

    renderNumbers();
}

/* ================= BOTTOM BAR ================= */
function renderNumbers() {
    const box = document.getElementById("numbers");
    box.innerHTML = "";

    questions.forEach((_, i) => {
        let cls = "";
        if (i === index) cls = "white-box";
        if (answersState[i] === "pending") cls += " pending";
        if (answersState[i] === "correct") cls += " green";
        if (answersState[i] === "wrong") cls += " red";

        box.innerHTML += `<div class="num ${cls}">${i + 1}</div>`;
    });
}

/* ================= SELECT ANSWER ================= */
function selectAnswer(id, text, btn) {
    selectedAnswer = id;
    selectedBtn = btn;
    answersState[index] = "pending";
    renderNumbers();

    document.getElementById("modalTitle").innerText = text;
    document.getElementById("answerModal").style.display = "flex";
}

/* ================= MODALS ================= */
function closeAnswerModal() {
    document.getElementById("answerModal").style.display = "none";
}
function openExitModal() {
    document.getElementById("exitModal").style.display = "flex";
}
function closeExitModal() {
    document.getElementById("exitModal").style.display = "none";
}

/* ================= CONFIRM ANSWER ================= */
function confirmAnswer() {
    document.querySelectorAll(".ans-btn")
        .forEach(b => b.classList.remove("correct", "wrong"));

    const isCorrect = selectedBtn.dataset.correct === "true";
    answersState[index] = isCorrect ? "correct" : "wrong";

    selectedBtn.classList.add(isCorrect ? "correct" : "wrong");
    renderNumbers();

    fetch("{% url 'submit_answer' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
            session_id: sessionId,
            question_id: questions[index].id,
            answer_id: selectedAnswer
        })
    });

    closeAnswerModal();

    setTimeout(() => {
        index++;
        if (index >= questions.length) {
            finishTest();
        } else {
            renderQuestion();
        }
    }, 500);
}

/* ================= FULLSCREEN ================= */
document.getElementById("fsBtn").onclick = () => {
    if (!document.fullscreenElement)
        document.documentElement.requestFullscreen();
    else
        document.exitFullscreen();
};

/* ================= HOTKEYS ================= */
document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "l") document.getElementById("fsBtn").click();
    if (e.key === "Escape") openExitModal();
});

/* ================= FINISH ================= */
function finishTest() {
    window.location.href = "/test-finish/" + sessionId;
}

/* ================= START ================= */
startTimer();
renderQuestion();
</script>

</body>
</html>
