<head>
    <meta charset="utf-8" />
            <title>{% trans "AvtoIbrat - O'quv platforma paneli!" %}</title>
            <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
            <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
            <meta content="" name="author" />
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />

            <!-- App favicon -->
            <link rel="shortcut icon" href="{% static 'assets_dashboard/images/favicon.png' %}">

     <!-- App css -->
     <link href="{% static 'assets_dashboard/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
     <link href="{% static 'assets_dashboard/css/icons.min.css' %}" rel="stylesheet" type="text/css" />
     <link href="{% static 'assets_dashboard/css/app.min.css' %}" rel="stylesheet" type="text/css" />

</head>

<body id="body" class="auth-page" style="background-image: url('{% static 'assets_dashboard/images/p-1.png' %}'); background-size: cover; background-position: center center;">
    <!-- Log In page -->
    <div class="container">
        <div class="row vh-100 d-flex justify-content-center">
            <div class="col-12 align-self-center">
                <div class="row">
                    <div class="col-lg-5 mx-auto">
                        <div class="card">
                            <div class="card-body p-0 auth-header-box">
                                <div class="text-center p-3">
                                    <a href="{% url 'home' %}" class="logo logo-admin">
                                        <img src="{% static 'assets_dashboard/images/logo-sm.png' %}" height="70" alt="logo" class="auth-logo">
                                    </a>
                                    <h4 class="mt-3 mb-1 fw-semibold text-white font-18">{% trans "Hisobni qayta tiklash" %}</h4>
                                    <p class="text-muted  mb-0">{% trans "Hisobni qayta tiklash uchun, admin bilan bo'glaning !" %}</p>
                                </div>
                            </div>
                            <div class="card-body pt-0">
                                <form class="my-4" action="https://themes.getappui.com/collab/unikit/default/{% url 'home' %}">
                                    <div class="form-group mb-0 row">
                                        <div class="col-12">
                                            <a href="tel:+998946274111" class="btn btn-primary w-100">
                                                {% trans "Bog'lanish" %} <i class="fas fa-phone"></i>
                                            </a>
                                        </div><!--end col--> 
                                    </div> <!--end form-group-->                           
                                </form><!--end form-->
                                <div class="text-center text-muted">
                                    <p class="mb-1">{% trans "Hisobingiz tiklandimi ?" %}  <a href="{% url 'login' %}" class="text-primary ms-2">{% trans "Hisobga kirish" %}</a></p>
                                </div>
                            </div><!--end card-body-->
                            <div class="card-body bg-light-alt text-center">
                                &copy; <script>
                                    document.write(new Date().getFullYear())
                                </script> AvtoIbrart                                           
                            </div>
                        </div><!--end card-->
                    </div><!--end col-->
                </div><!--end row-->
            </div><!--end col-->
        </div><!--end row-->
    </div><!--end container-->

    <!-- App js -->
    <script src="{% static 'assets_dashboard/js/app.js' %}"></script>
    
</body>
