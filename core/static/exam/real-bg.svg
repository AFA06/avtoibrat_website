<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Real exam backdrop: deep blue with soft light and glowing frames in perspective, like an exam terminal screen. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b3a"/>
      <stop offset="0.45" stop-color="#15405f"/>
      <stop offset="1" stop-color="#0e2133"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2f78a8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#2f78a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.1" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#0b1622" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0b1622" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- A diagonal beam of light. -->
  <path d="M250 0 L700 0 L1450 900 L900 900 Z" fill="#3c8fc4" opacity="0.18" filter="url(#haze)"/>

  <!-- Frames and scan lines on a tilted plane. -->
  <g transform="translate(800 420) rotate(-12) skewX(-14) translate(-800 -420)" fill="none" stroke="#5fb3e6" filter="url(#soft)">
    <rect x="380" y="60" width="150" height="130" rx="6" stroke-width="7" opacity="0.35"/>
    <rect x="570" y="70" width="190" height="170" rx="6" stroke-width="8" opacity="0.45"/>
    <rect x="1000" y="250" width="270" height="250" rx="8" stroke-width="9" opacity="0.5"/>
    <rect x="1330" y="300" width="220" height="200" rx="8" stroke-width="7" opacity="0.22"/>
    <rect x="200" y="420" width="200" height="170" rx="6" stroke-width="6" opacity="0.18"/>
    <g stroke-width="3" opacity="0.35" stroke-linecap="round">
      <path d="M0 360 H620"/>
      <path d="M300 640 H1250"/>
      <path d="M760 560 H1100"/>
      <path d="M1320 210 H1560"/>
      <path d="M1320 250 H1500"/>
      <path d="M1320 330 H1460"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#shade)"/>
</svg>
